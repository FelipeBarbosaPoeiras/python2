{% extends "base.html" %}
{% block titulo %}Progresso{% endblock %}
{% block conteudo %}
<h3 class="mb-4"><i class="bi bi-bar-chart-line"></i> Dashboard de progresso</h3>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-center">Tarefas por status (barras)</h5>
                <canvas id="graficoBarras"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-center">Tarefas por status (pizza)</h5>
                <canvas id="graficoPizza"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
    async function carregarProgresso() {
        const resp = await fetch('/api/progresso');
        const dados = await resp.json();

        const labels = ['Pendente', 'Em andamento', 'Concluída'];
        const valores = [dados.pendente, dados.andamento, dados.concluida];
        const cores = ['#ffc107', '#0d6efd', '#198754'];

        new Chart(document.getElementById('graficoBarras'), {
            type: 'bar',
            data: {
                labels,
                datasets: [{ label: 'Quantidade de tarefas', data: valores, backgroundColor: cores }]
            },
            options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });

        new Chart(document.getElementById('graficoPizza'), {
            type: 'pie',
            data: { labels, datasets: [{ data: valores, backgroundColor: cores }] }
        });
    }
    carregarProgresso();
</script>
{% endblock %}
