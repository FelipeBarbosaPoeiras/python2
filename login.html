<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade 5 - Login</title>
</head>
<body>
    <h2>Página de Login</h2>
    
    <!-- Mostra mensagem de erro se o login falhar -->
    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <label>Nome:</label><br>
        <input type="text" name="usuario" placeholder="Digite seu nome" required><br><br>
        
        <label>Senha (Matrícula):</label><br>
        <input type="password" name="senha" placeholder="Digite sua matrícula" required><br><br>
        
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
